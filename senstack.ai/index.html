<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0d0b1a" />
<title>SENSTACK AI | Learn to learn AI! </title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --violet:     #a06bff;
    --violet-lt:  #c9a6ff;
    --ink:        #0d0b1a;
    --panel:      #14122a;
    --text:       #f1eefc;
    --muted:      #b6aed6;
  }

  html, body{
    min-height: 100%;
    background: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
  }

  body{
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    overflow-x: hidden;
  }

  .hero-bg{
    position: fixed;
    inset: 0;
    background-image: url('AI_executive_assistant.jpeg');
    background-size: cover;
    background-position: center 20%;
    z-index: 0;
  }

  .hero-scrim{
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13,11,26,0.35) 0%, rgba(13,11,26,0.55) 45%, rgba(13,11,26,0.96) 88%),
      radial-gradient(ellipse at 50% 0%, rgba(160,107,255,0.12) 0%, rgba(13,11,26,0) 60%);
    z-index: 0;
  }

  .content{
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 6vw 5vh;
    text-align: center;
  }

  .brand{
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--violet-lt);
    margin-bottom: 8px;
  }

  h1{
    font-size: clamp(26px, 6vw, 40px);
    letter-spacing: 0.02em;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .tagline{
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
    max-width: 420px;
    line-height: 1.5;
    margin-bottom: 34px;
  }

  .menu{
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(380px, 88vw);
    margin-bottom: 34px;
  }

  .btn{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 24px;
    border-radius: 14px;
    text-decoration: none;
    border: 1px solid rgba(160,107,255,0.35);
    background: linear-gradient(180deg, rgba(160,107,255,0.14), rgba(20,18,42,0.6));
    backdrop-filter: blur(6px);
    transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .btn:hover{
    transform: translateY(-2px);
    border-color: var(--violet);
    background: linear-gradient(180deg, rgba(160,107,255,0.26), rgba(20,18,42,0.75));
  }
  .btn:active{ transform: translateY(0) scale(0.985); }

  .btn .label{
    font-size: clamp(17px, 4.2vw, 20px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text);
  }
  .btn .sub{
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--violet-lt);
    opacity: 0.9;
  }

  .audio-bar{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(160,107,255,0.3);
    background: rgba(20,18,42,0.6);
    backdrop-filter: blur(6px);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .audio-bar:hover{ border-color: var(--violet); color: var(--text); }

  .audio-bar .dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--violet);
    flex-shrink: 0;
  }
  .audio-bar.playing .dot{
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .footer{
    margin-top: 26px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(241,238,252,0.4);
  }
</style>
</head>
<body>

  <div class="hero-bg"></div>
  <div class="hero-scrim"></div>

  <div class="content">
    <div class="brand">Senstack · AI Leadership</div>
    <h1>Your AI, Working While You Lead</h1>
    <p class="tagline">Executive-grade automation for calendars, inboxes, and everything in between.</p>

    <nav class="menu">
      <a class="btn" href="Academy Live/">
        <span class="label">Academy Live</span>
        <span class="sub">Enter</span>
      </a>
      <a class="btn" href="CasefileCCC/">
        <span class="label">Credit Repair with AI</span>
        <span class="sub">Enter</span>
      </a>
    </nav>

    <div class="audio-bar" id="audioToggle">
      <span class="dot"></span>
      <span id="audioLabel">Unmute</span>
    </div>

    <div class="footer">SENSTACK AI</div>
  </div>

  <audio id="ad1" src="Alexa.mp3" preload="auto"></audio>
  <audio id="ad2" src="aiconfusing.mp3" preload="auto"></audio>

  <script>
    const toggle = document.getElementById('audioToggle');
    const label = document.getElementById('audioLabel');
    const ad1 = document.getElementById('ad1');
    const ad2 = document.getElementById('ad2');
    let playing = false;

    function stopAll(){
      ad1.pause(); ad1.currentTime = 0;
      ad2.pause(); ad2.currentTime = 0;
      playing = false;
      toggle.classList.remove('playing');
      label.textContent = 'Tap to hear ads';
    }

    function playSequence(){
      playing = true;
      toggle.classList.add('playing');
      label.textContent = 'Playing ad 1 of 2';
      ad1.currentTime = 0;
      ad1.play();
    }

    ad1.addEventListener('ended', () => {
      if (!playing) return;
      label.textContent = 'Playing ad 2 of 2';
      ad2.currentTime = 0;
      ad2.play();
    });

    ad2.addEventListener('ended', () => {
      stopAll();
    });

    toggle.addEventListener('click', () => {
      if (playing) {
        stopAll();
      } else {
        playSequence();
      }
    });
  </script>

</body>
</html>
