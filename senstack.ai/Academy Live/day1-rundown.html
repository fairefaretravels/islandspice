<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Day 1 Rundown — Teach AI About You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-line:#242019;
    --gold:#C8963E;
    --gold-light:#c8a96e;
    --text:#f3efe7;
    --text-dim:#9a9488;
    --on-air:#c0392b;
    --good:#4a7c59;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
    overflow:hidden;
  }
  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.04em;}

  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: 64px 1fr 96px;
    grid-template-areas:
      "header header"
      "rundown script"
      "footer footer";
    height:100vh;
  }

  /* HEADER */
  header{
    grid-area:header;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--panel-line);
    background:linear-gradient(180deg,#161616,#0a0a0a);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .alldays-link{
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    border:1px solid var(--panel-line);
    border-radius:5px;
    padding:6px 10px;
    margin-right:6px;
    white-space:nowrap;
  }
  .alldays-link:hover{color:var(--gold-light); border-color:var(--gold);}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--text-dim);}
  .brand .dot.live{background:var(--on-air); box-shadow:0 0 0 0 rgba(192,57,43,0.7); animation:pulse 1.6s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(192,57,43,0.55);}
    70%{box-shadow:0 0 0 10px rgba(192,57,43,0);}
    100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}
  }
  .brand h1{font-size:22px; margin:0; color:var(--gold-light); font-weight:400;}
  .brand span.sub{font-size:14px; color:var(--text-dim); margin-left:4px;}
  .clocks{display:flex; gap:22px; align-items:baseline;}
  .clock{text-align:right;}
  .clock .label{font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-dim); display:block;}
  .clock .val{font-family:'Bebas Neue'; font-size:26px; color:var(--text);}
  .clock.over .val{color:var(--on-air);}

  /* RUNDOWN */
  .rundown{
    grid-area:rundown;
    border-right:1px solid var(--panel-line);
    overflow-y:auto;
    padding:8px;
  }
  .seg{
    display:flex;
    gap:10px;
    padding:12px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:4px;
    border-left:3px solid transparent;
  }
  .seg:hover{background:#1a1712;}
  .seg.active{background:#1f1a10; border-left-color:var(--gold);}
  .seg .num{font-family:'Bebas Neue'; font-size:20px; color:var(--gold-light); min-width:22px;}
  .seg .info{flex:1;}
  .seg .title{font-size:16px; font-weight:600; line-height:1.15;}
  .seg .dur{font-size:12px; color:var(--text-dim);}
  .seg.done .title, .seg.done .num{color:var(--text-dim);}
  .seg.done{opacity:0.55;}

  /* SCRIPT */
  .script-wrap{
    grid-area:script;
    position:relative;
    overflow:hidden;
    background:radial-gradient(ellipse at top, #171310 0%, #0a0a0a 55%);
  }
  .script-scroll{
    height:100%;
    overflow-y:auto;
    padding:40px 60px 200px 60px;
    scroll-behavior:smooth;
  }
  .script-scroll::-webkit-scrollbar{width:0;}
  .seg-eyebrow{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    color:var(--gold);
    margin-bottom:6px;
  }
  .seg-heading{
    font-family:'Bebas Neue';
    font-size:38px;
    color:var(--gold-light);
    margin:0 0 22px 0;
  }
  .cue{
    color:var(--gold-light);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    border-left:2px solid var(--gold);
    padding-left:10px;
    margin:22px 0 6px 0;
  }
  .script-text{
    font-size:var(--fs, 30px);
    line-height:1.5;
    font-weight:500;
    color:var(--text);
    max-width:900px;
  }
  .script-text p{margin:0 0 22px 0;}
  .fade-top, .fade-bottom{
    position:absolute; left:0; right:0; height:60px; pointer-events:none; z-index:2;
  }
  .fade-top{top:0; background:linear-gradient(180deg, #0a0a0a, transparent);}
  .fade-bottom{bottom:96px; background:linear-gradient(0deg, #0a0a0a, transparent);}

  /* FOOTER CONTROLS */
  footer{
    grid-area:footer;
    border-top:1px solid var(--panel-line);
    background:#0f0f0f;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 20px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Barlow Condensed';
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
  }
  button:hover{border-color:var(--gold);}
  button:focus-visible, .seg:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  #goLive{background:var(--gold); color:#141414; border-color:var(--gold);}
  #goLive.live{background:var(--on-air); color:#fff; border-color:var(--on-air);}
  .ctrl-group{display:flex; align-items:center; gap:8px;}
  .ctrl-group label{font-size:12px; text-transform:uppercase; color:var(--text-dim); letter-spacing:0.08em;}
  input[type=range]{accent-color:var(--gold); width:100px;}

  @media (max-width:820px){
    .app{
      grid-template-columns:1fr;
      grid-template-rows:64px 130px 1fr 120px;
      grid-template-areas:
        "header"
        "rundown"
        "script"
        "footer";
    }
    .rundown{
      display:flex;
      overflow-x:auto;
      overflow-y:hidden;
      border-right:none;
      border-bottom:1px solid var(--panel-line);
    }
    .seg{min-width:150px;}
    .script-scroll{padding:24px 22px 160px 22px;}
    .seg-heading{font-size:28px;}
    .script-text{font-size:24px;}
    footer{overflow-x:auto;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <a class="alldays-link" href="index.html">← All Days</a>
      <span class="dot" id="liveDot"></span>
      <h1 class="display">LEARN HOW TO LEARN AI</h1>
      <span class="sub">Day 1 · Teach AI About You</span>
    </div>
    <div class="clocks">
      <div class="clock">
        <span class="label">Segment</span>
        <span class="val" id="segClock">05:00</span>
      </div>
      <div class="clock" id="totalClockWrap">
        <span class="label">Total elapsed</span>
        <span class="val" id="totalClock">00:00</span>
      </div>
    </div>
  </header>

  <nav class="rundown" id="rundown"></nav>

  <main class="script-wrap">
    <div class="fade-top"></div>
    <div class="script-scroll" id="scriptScroll"></div>
    <div class="fade-bottom"></div>
  </main>

  <footer>
    <button id="goLive">Go live</button>
    <button id="prevSeg">← Prev</button>
    <button id="nextSeg">Next →</button>
    <div class="ctrl-group">
      <label>Auto-scroll</label>
      <button id="scrollToggle">Off</button>
      <input type="range" id="speedSlider" min="10" max="100" value="35">
    </div>
    <div class="ctrl-group">
      <label>Text size</label>
      <button id="fontMinus">A-</button>
      <button id="fontPlus">A+</button>
    </div>
    <div class="ctrl-group">
      <label>Mirror</label>
      <button id="mirrorToggle">Off</button>
    </div>
  </footer>

</div>

<script>
const segments = [
  {
    title: "Cold Open",
    minutes: 5,
    cue: "Energy up. Look at the lens, not the screen.",
    body: [
      "Hey — welcome in, wherever you're watching from, TikTok or YouTube, I see you.",
      "If you've ever opened ChatGPT, typed something in, gotten a mediocre answer, and just closed the tab — this is for you.",
      "This is Learn How to Learn AI. Five days. Five Challenges. Today is Challenge One: Teach AI About You.",
      "By the end of this session you're walking away with a personal assistant prompt that actually works for your life — not a template, yours."
    ]
  },
  {
    title: "Philosophy",
    minutes: 5,
    cue: "Slow down here. This is the line people repeat.",
    body: [
      "Before we touch anything, I want you to hear the one thing I want you to remember after every other detail is forgotten.",
      "I'm not teaching you ChatGPT. I'm teaching you how to learn any AI that comes out next year.",
      "Tools change. Models change. What doesn't change is knowing how to ask, how to test, how to iterate. That's the actual skill. Everything else is just today's interface.",
      "So today's Challenge — Teach AI About You — isn't about memorizing a prompt. It's about learning the pattern so you can do this with literally any AI tool, forever."
    ]
  },
  {
    title: "Teach: What AI Is / Isn't",
    minutes: 20,
    cue: "Screen-share here. Live demo, not slides.",
    body: [
      "First: what AI actually is. It's a prediction engine. It's not a mind reader, it's not magic, and it's not always right. It's a very well-read collaborator that needs context to be useful.",
      "What AI isn't: it isn't going to guess what you meant if you don't tell it. Vague in, vague out. That's the single biggest reason people bounce off these tools after one bad try.",
      "So the skill isn't 'knowing the right prompt.' It's knowing how to ask a better question. Watch this — I'm going to ask a bad version first, then fix it live.",
      "[Live: type a vague prompt, show the mediocre output.]",
      "See that? Generic. Because I gave it nothing to work with. Now watch what happens when I give it context — who I am, what I actually want, what 'good' looks like for me.",
      "[Live: rewrite the prompt with specifics, show the improved output.]",
      "That's the whole game. Context, specificity, and telling it what success looks like. That pattern works in every AI tool that exists right now, and every one that gets released next year."
    ]
  },
  {
    title: "Build: Your Assistant Prompt",
    minutes: 20,
    cue: "Invite chat to build alongside you in real time.",
    body: [
      "Okay — let's build your actual project. Today's Challenge: Teach AI About You. We're building a personal assistant prompt, live, right now.",
      "Step one: tell it who you are. Not your resume — your actual day. What you're juggling, what keeps falling through the cracks.",
      "Step two: tell it what 'helpful' means to you specifically. Some people want short and blunt. Some people want options. Tell it.",
      "Step three: give it a standing job. Not 'help me sometimes' — give it a repeatable task, like 'every time I paste my day, reorganize it by priority.'",
      "[Live: build the full prompt on screen, paste it in, show the output responding correctly to who you are.]",
      "If you're watching and building this with me right now — drop in chat what your assistant just told you. I want to see what it built for you specifically."
    ]
  },
  {
    title: "Q&A",
    minutes: 10,
    cue: "Pull real questions from chat. Don't rush answers.",
    body: [
      "Let's open it up — what's coming up in chat? Don't be shy, if your prompt didn't work the way you wanted, that's exactly what we should look at live.",
      "[Read 3–5 questions from chat, troubleshoot live by rewriting a prompt on screen if someone's stuck.]",
      "Good questions. Notice — every fix we just made was the same move: add context, get specific, tell it what success looks like. That pattern again."
    ]
  },
  {
    title: "Coaching Offer",
    minutes: 5,
    cue: "Slow down, direct eye contact, say this plainly — no hard sell energy.",
    body: [
      "If today's Challenge got your brain moving, here's how to go further.",
      "You can keep doing this self-paced — lesson, project, done, at your own pace.",
      "If you want accountability, group coaching gets you a live weekly Q&A with me, alongside everyone else in the course.",
      "But if you've got a specific thing you're trying to build — your business, your side hustle, your résumé, whatever it is — 1-on-1 coaching is where we sit down and build your thing, not a generic example.",
      "I'm opening a few spots for founding-rate 1-on-1 coaching to people watching live right now. Link's in the bio and description. Comment 'COACH' and I'll follow up with you personally."
    ]
  },
  {
    title: "Close + Tomorrow",
    minutes: 5,
    cue: "Warm close. Say the philosophy line one last time.",
    body: [
      "That's Challenge One in the books. You built a personal assistant prompt that's actually yours — save it, use it tomorrow morning, see how it holds up.",
      "Tomorrow is Challenge Two: Save Yourself One Hour — we're building an AI life planner. If today clicked for you, tomorrow's going to click harder.",
      "Last thing, one more time, because I want it to stick: I'm not teaching you ChatGPT. I'm teaching you how to learn any AI that comes out next year.",
      "See you tomorrow. Same time, same place."
    ]
  }
];


let current = 0;
let segRemaining = segments[0].minutes * 60;
let totalElapsed = 0;
let timerId = null;
let live = false;
let autoScroll = false;
let scrollSpeed = 35;
let fontSize = 30;
let mirrored = false;

const rundownEl = document.getElementById('rundown');
const scriptScroll = document.getElementById('scriptScroll');
const segClockEl = document.getElementById('segClock');
const totalClockEl = document.getElementById('totalClock');
const totalClockWrap = document.getElementById('totalClockWrap');
const liveDot = document.getElementById('liveDot');
const goLiveBtn = document.getElementById('goLive');

function fmt(sec){
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const r = (s%60).toString().padStart(2,'0');
  return m+":"+r;
}

function renderRundown(){
  rundownEl.innerHTML = '';
  segments.forEach((seg, i) => {
    const div = document.createElement('div');
    div.className = 'seg' + (i===current ? ' active' : '') + (i<current ? ' done' : '');
    div.tabIndex = 0;
    div.innerHTML = `<span class="num display">${(i+1).toString().padStart(2,'0')}</span>
      <span class="info"><span class="title">${seg.title}</span><br><span class="dur">${seg.minutes} min</span></span>`;
    div.onclick = () => jumpTo(i);
    rundownEl.appendChild(div);
  });
}

function renderScript(){
  const seg = segments[current];
  scriptScroll.innerHTML = `
    <div class="seg-eyebrow">Segment ${(current+1).toString().padStart(2,'0')} of ${segments.length}</div>
    <h2 class="seg-heading display">${seg.title}</h2>
    <div class="cue">${seg.cue}</div>
    <div class="script-text" style="--fs:${fontSize}px">
      ${seg.body.map(p => `<p>${p}</p>`).join('')}
    </div>
  `;
  scriptScroll.scrollTop = 0;
}

function jumpTo(i){
  current = i;
  segRemaining = segments[i].minutes * 60;
  renderRundown();
  renderScript();
}

document.getElementById('prevSeg').onclick = () => { if(current>0) jumpTo(current-1); };
document.getElementById('nextSeg').onclick = () => { if(current<segments.length-1) jumpTo(current+1); };

goLiveBtn.onclick = () => {
  live = !live;
  goLiveBtn.textContent = live ? 'End' : 'Go live';
  goLiveBtn.classList.toggle('live', live);
  liveDot.classList.toggle('live', live);
  if(live){
    timerId = setInterval(tick, 1000);
  } else {
    clearInterval(timerId);
  }
};

function tick(){
  segRemaining -= 1;
  totalElapsed += 1;
  segClockEl.textContent = fmt(segRemaining);
  segClockEl.parentElement.classList.toggle('over', segRemaining <= 0);
  totalClockEl.textContent = fmt(totalElapsed);
}

document.getElementById('scrollToggle').onclick = (e) => {
  autoScroll = !autoScroll;
  e.target.textContent = autoScroll ? 'On' : 'Off';
};
document.getElementById('speedSlider').oninput = (e) => { scrollSpeed = Number(e.target.value); };

document.getElementById('fontPlus').onclick = () => {
  fontSize = Math.min(52, fontSize+2);
  scriptScroll.querySelector('.script-text').style.setProperty('--fs', fontSize+'px');
};
document.getElementById('fontMinus').onclick = () => {
  fontSize = Math.max(18, fontSize-2);
  scriptScroll.querySelector('.script-text').style.setProperty('--fs', fontSize+'px');
};

document.getElementById('mirrorToggle').onclick = (e) => {
  mirrored = !mirrored;
  document.querySelector('.script-wrap').style.transform = mirrored ? 'scaleX(-1)' : 'none';
  e.target.textContent = mirrored ? 'On' : 'Off';
};

function autoScrollLoop(){
  if(autoScroll){
    scriptScroll.scrollTop += scrollSpeed/50;
  }
  requestAnimationFrame(autoScrollLoop);
}
requestAnimationFrame(autoScrollLoop);

segClockEl.textContent = fmt(segRemaining);
renderRundown();
renderScript();
</script>
</body>
</html>
