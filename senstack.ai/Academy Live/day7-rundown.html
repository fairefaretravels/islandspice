<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Day 7 Rundown — Numbers Without the Headache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-line:#242019;
    --gold:#C8963E;
    --gold-light:#c8a96e;
    --text:#f3efe7;
    --text-dim:#9a9488;
    --on-air:#c0392b;
    --good:#4a7c59;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
    overflow:hidden;
  }
  .display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.04em;}

  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: 64px 1fr 96px;
    grid-template-areas:
      "header header"
      "rundown script"
      "footer footer";
    height:100vh;
  }

  header{
    grid-area:header;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--panel-line);
    background:linear-gradient(180deg,#161616,#0a0a0a);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .alldays-link{
    color:var(--text-dim);
    text-decoration:none;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    border:1px solid var(--panel-line);
    border-radius:5px;
    padding:6px 10px;
    margin-right:6px;
    white-space:nowrap;
  }
  .alldays-link:hover{color:var(--gold-light); border-color:var(--gold);}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--text-dim);}
  .brand .dot.live{background:var(--on-air); box-shadow:0 0 0 0 rgba(192,57,43,0.7); animation:pulse 1.6s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(192,57,43,0.55);}
    70%{box-shadow:0 0 0 10px rgba(192,57,43,0);}
    100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}
  }
  .brand h1{font-size:22px; margin:0; color:var(--gold-light); font-weight:400;}
  .brand span.sub{font-size:14px; color:var(--text-dim); margin-left:4px;}
  .clocks{display:flex; gap:22px; align-items:baseline;}
  .clock{text-align:right;}
  .clock .label{font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-dim); display:block;}
  .clock .val{font-family:'Bebas Neue'; font-size:26px; color:var(--text);}
  .clock.over .val{color:var(--on-air);}

  .rundown{
    grid-area:rundown;
    border-right:1px solid var(--panel-line);
    overflow-y:auto;
    padding:8px;
  }
  .seg{
    display:flex;
    gap:10px;
    padding:12px 10px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:4px;
    border-left:3px solid transparent;
  }
  .seg:hover{background:#1a1712;}
  .seg.active{background:#1f1a10; border-left-color:var(--gold);}
  .seg .num{font-family:'Bebas Neue'; font-size:20px; color:var(--gold-light); min-width:22px;}
  .seg .info{flex:1;}
  .seg .title{font-size:16px; font-weight:600; line-height:1.15;}
  .seg .dur{font-size:12px; color:var(--text-dim);}
  .seg.done .title, .seg.done .num{color:var(--text-dim);}
  .seg.done{opacity:0.55;}

  .script-wrap{
    grid-area:script;
    position:relative;
    overflow:hidden;
    background:radial-gradient(ellipse at top, #171310 0%, #0a0a0a 55%);
  }
  .script-scroll{
    height:100%;
    overflow-y:auto;
    padding:40px 60px 200px 60px;
    scroll-behavior:smooth;
  }
  .script-scroll::-webkit-scrollbar{width:0;}
  .seg-eyebrow{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.18em;
    color:var(--gold);
    margin-bottom:6px;
  }
  .seg-heading{
    font-family:'Bebas Neue';
    font-size:38px;
    color:var(--gold-light);
    margin:0 0 22px 0;
  }
  .cue{
    color:var(--gold-light);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    border-left:2px solid var(--gold);
    padding-left:10px;
    margin:22px 0 6px 0;
  }
  .script-text{
    font-size:var(--fs, 30px);
    line-height:1.5;
    font-weight:500;
    color:var(--text);
    max-width:900px;
  }
  .script-text p{margin:0 0 22px 0;}
  .fade-top, .fade-bottom{
    position:absolute; left:0; right:0; height:60px; pointer-events:none; z-index:2;
  }
  .fade-top{top:0; background:linear-gradient(180deg, #0a0a0a, transparent);}
  .fade-bottom{bottom:96px; background:linear-gradient(0deg, #0a0a0a, transparent);}

  footer{
    grid-area:footer;
    border-top:1px solid var(--panel-line);
    background:#0f0f0f;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 20px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Barlow Condensed';
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
  }
  button:hover{border-color:var(--gold);}
  button:focus-visible, .seg:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  #goLive{background:var(--gold); color:#141414; border-color:var(--gold);}
  #goLive.live{background:var(--on-air); color:#fff; border-color:var(--on-air);}
  .ctrl-group{display:flex; align-items:center; gap:8px;}
  .ctrl-group label{font-size:12px; text-transform:uppercase; color:var(--text-dim); letter-spacing:0.08em;}
  input[type=range]{accent-color:var(--gold); width:100px;}

  @media (max-width:820px){
    .app{
      grid-template-columns:1fr;
      grid-template-rows:64px 130px 1fr 120px;
      grid-template-areas:
        "header"
        "rundown"
        "script"
        "footer";
    }
    .rundown{
      display:flex;
      overflow-x:auto;
      overflow-y:hidden;
      border-right:none;
      border-bottom:1px solid var(--panel-line);
    }
    .seg{min-width:150px;}
    .script-scroll{padding:24px 22px 160px 22px;}
    .seg-heading{font-size:28px;}
    .script-text{font-size:24px;}
    footer{overflow-x:auto;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <a class="alldays-link" href="index.html">← All Days</a>
      <span class="dot" id="liveDot"></span>
      <h1 class="display">LEARN HOW TO LEARN AI</h1>
      <span class="sub">Day 7 · Numbers Without the Headache</span>
    </div>
    <div class="clocks">
      <div class="clock">
        <span class="label">Segment</span>
        <span class="val" id="segClock">05:00</span>
      </div>
      <div class="clock" id="totalClockWrap">
        <span class="label">Total elapsed</span>
        <span class="val" id="totalClock">00:00</span>
      </div>
    </div>
  </header>

  <nav class="rundown" id="rundown"></nav>

  <main class="script-wrap">
    <div class="fade-top"></div>
    <div class="script-scroll" id="scriptScroll"></div>
    <div class="fade-bottom"></div>
  </main>

  <footer>
    <button id="goLive">Go live</button>
    <button id="prevSeg">← Prev</button>
    <button id="nextSeg">Next →</button>
    <div class="ctrl-group">
      <label>Auto-scroll</label>
      <button id="scrollToggle">Off</button>
      <input type="range" id="speedSlider" min="10" max="100" value="35">
    </div>
    <div class="ctrl-group">
      <label>Text size</label>
      <button id="fontMinus">A-</button>
      <button id="fontPlus">A+</button>
    </div>
    <div class="ctrl-group">
      <label>Mirror</label>
      <button id="mirrorToggle">Off</button>
    </div>
  </footer>

</div>

<script>
const segments = [
  {
    "title": "Cold Open",
    "minutes": 5,
    "cue": "Energy up. Look at the lens, not the screen.",
    "body": [
      "Day 7 \u2014 the one where the spreadsheet stops being scary.",
      "This is Learn How to Learn AI, Challenge Seven: Numbers Without the Headache.",
      "Today's project: take a real messy spreadsheet and organize it into something you can actually read \u2014 live, in this session."
    ]
  },
  {
    "title": "Philosophy",
    "minutes": 5,
    "cue": "Say the line the same way every day \u2014 it's the anchor.",
    "body": [
      "Same line, every day, because it's the whole point: I'm not teaching you ChatGPT. I'm teaching you how to learn any AI that comes out next year.",
      "Spreadsheet tools turn over constantly \u2014 new formulas, new AI features bolted onto old software. What doesn't turn over is knowing how to describe what a clean table looks like and what question you're actually trying to answer.",
      "That's today's real skill: describing your data and your question clearly enough that any AI can organize it and answer it."
    ]
  },
  {
    "title": "Teach: AI for Data",
    "minutes": 20,
    "cue": "Screen-share. Use a real (or example) messy dataset.",
    "body": [
      "Cleaning and analyzing both start in the same place: can you say what a row should mean, and what you're actually trying to find out?",
      "Watch what happens when we hand AI a messy sheet with no description versus one with a clear goal attached.",
      "[Live: show AI mangling an undescribed dataset, then handling it cleanly once the columns and the goal are named.]",
      "The lesson: AI can't organize what you haven't defined. Name your columns and your goal, and the mess clears up fast."
    ]
  },
  {
    "title": "Build: Clean a Real Spreadsheet",
    "minutes": 20,
    "cue": "Build live, start to finish, on one real sheet.",
    "body": [
      "Let's fix something real, right now. Step one: open a genuinely messy sheet \u2014 duplicate rows, blank cells, inconsistent formatting.",
      "Step two: describe in one sentence what the clean version should let you see.",
      "Step three: have AI propose a cleanup plan, then generate a summary view \u2014 totals, trends, outliers.",
      "[Live: paste the data, describe the goal, generate the clean table and a takeaway.]",
      "If you're doing this along with me, drop what your messiest spreadsheet is about in chat \u2014 I'll react to a few live."
    ]
  },
  {
    "title": "Q&A",
    "minutes": 10,
    "cue": "Pull real questions from chat.",
    "body": [
      "What's in chat \u2014 what data are you drowning in?",
      "[Read questions, turn a vague ask into a specific one live.]",
      "Every fix is the same: name the columns, name the question, not a smarter tool."
    ]
  },
  {
    "title": "Coaching Offer",
    "minutes": 5,
    "cue": "Slow down, direct eye contact, say this plainly.",
    "body": [
      "If today turned a messy sheet into something useful, here's how to go further.",
      "Self-paced: keep building through the remaining Challenges on your own.",
      "Group coaching: weekly live Q&A with me and the group.",
      "1-on-1 coaching: we build your actual workflow together, tailored to your real data, not a generic template.",
      "A few founding-rate 1-on-1 spots are open right now for people watching live. Link's in the bio and description. Comment 'COACH' and I'll follow up with you personally."
    ]
  },
  {
    "title": "Close + Tomorrow",
    "minutes": 5,
    "cue": "Warm close. Say the philosophy line one last time.",
    "body": [
      "That's Challenge Seven done \u2014 a real spreadsheet cleaned and summarized, live, in one session.",
      "Tomorrow is Challenge Eight: Documents on Demand. We turn a rough idea into a real first draft of a report, memo, or proposal.",
      "One more time: I'm not teaching you ChatGPT. I'm teaching you how to learn any AI that comes out next year.",
      "See you tomorrow."
    ]
  }
];


let current = 0;
let segRemaining = segments[0].minutes * 60;
let totalElapsed = 0;
let timerId = null;
let live = false;
let autoScroll = false;
let scrollSpeed = 35;
let fontSize = 30;
let mirrored = false;

const rundownEl = document.getElementById('rundown');
const scriptScroll = document.getElementById('scriptScroll');
const segClockEl = document.getElementById('segClock');
const totalClockEl = document.getElementById('totalClock');
const totalClockWrap = document.getElementById('totalClockWrap');
const liveDot = document.getElementById('liveDot');
const goLiveBtn = document.getElementById('goLive');

function fmt(sec){
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const r = (s%60).toString().padStart(2,'0');
  return m+":"+r;
}

function renderRundown(){
  rundownEl.innerHTML = '';
  segments.forEach((seg, i) => {
    const div = document.createElement('div');
    div.className = 'seg' + (i===current ? ' active' : '') + (i<current ? ' done' : '');
    div.tabIndex = 0;
    div.innerHTML = `<span class="num display">${(i+1).toString().padStart(2,'0')}</span>
      <span class="info"><span class="title">${seg.title}</span><br><span class="dur">${seg.minutes} min</span></span>`;
    div.onclick = () => jumpTo(i);
    rundownEl.appendChild(div);
  });
}

function renderScript(){
  const seg = segments[current];
  scriptScroll.innerHTML = `
    <div class="seg-eyebrow">Segment ${(current+1).toString().padStart(2,'0')} of ${segments.length}</div>
    <h2 class="seg-heading display">${seg.title}</h2>
    <div class="cue">${seg.cue}</div>
    <div class="script-text" style="--fs:${fontSize}px">
      ${seg.body.map(p => `<p>${p}</p>`).join('')}
    </div>
  `;
  scriptScroll.scrollTop = 0;
}

function jumpTo(i){
  current = i;
  segRemaining = segments[i].minutes * 60;
  renderRundown();
  renderScript();
}

document.getElementById('prevSeg').onclick = () => { if(current>0) jumpTo(current-1); };
document.getElementById('nextSeg').onclick = () => { if(current<segments.length-1) jumpTo(current+1); };

goLiveBtn.onclick = () => {
  live = !live;
  goLiveBtn.textContent = live ? 'End' : 'Go live';
  goLiveBtn.classList.toggle('live', live);
  liveDot.classList.toggle('live', live);
  if(live){
    timerId = setInterval(tick, 1000);
  } else {
    clearInterval(timerId);
  }
};

function tick(){
  segRemaining -= 1;
  totalElapsed += 1;
  segClockEl.textContent = fmt(segRemaining);
  segClockEl.parentElement.classList.toggle('over', segRemaining <= 0);
  totalClockEl.textContent = fmt(totalElapsed);
}

document.getElementById('scrollToggle').onclick = (e) => {
  autoScroll = !autoScroll;
  e.target.textContent = autoScroll ? 'On' : 'Off';
};
document.getElementById('speedSlider').oninput = (e) => { scrollSpeed = Number(e.target.value); };

document.getElementById('fontPlus').onclick = () => {
  fontSize = Math.min(52, fontSize+2);
  scriptScroll.querySelector('.script-text').style.setProperty('--fs', fontSize+'px');
};
document.getElementById('fontMinus').onclick = () => {
  fontSize = Math.max(18, fontSize-2);
  scriptScroll.querySelector('.script-text').style.setProperty('--fs', fontSize+'px');
};

document.getElementById('mirrorToggle').onclick = (e) => {
  mirrored = !mirrored;
  document.querySelector('.script-wrap').style.transform = mirrored ? 'scaleX(-1)' : 'none';
  e.target.textContent = mirrored ? 'On' : 'Off';
};

function autoScrollLoop(){
  if(autoScroll){
    scriptScroll.scrollTop += scrollSpeed/50;
  }
  requestAnimationFrame(autoScrollLoop);
}
requestAnimationFrame(autoScrollLoop);

segClockEl.textContent = fmt(segRemaining);
renderRundown();
renderScript();
</script>
</body>
</html>
