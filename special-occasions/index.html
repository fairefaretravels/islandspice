
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Occations | Mack Magic</title>

<style>
:root {
  --green: #24452f;
  --gold: #c6a15b;
  --cream: #f1e5ce;
  --burnt: #a9683e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  font-family: Arial, sans-serif;
  color: var(--green);
}

header {
  background: var(--green);
  color: var(--cream);
  padding: 25px;
  text-align: center;
  border-bottom: 5px solid var(--gold);
}

main {
  max-width: 850px;
  margin: 65px auto;
  padding: 20px;
  text-align: center;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(2.5rem, 7vw, 4rem);
  margin-bottom: 15px;
}

p { line-height: 1.7; }

select {
  width: 100%;
  max-width: 700px;
  padding: 25px;
  margin-top: 30px;
  font-size: 20px;
  font-weight: bold;
  color: var(--green);
  background: #fffaf0;
  border: 4px solid var(--gold);
  border-radius: 12px;
  cursor: pointer;
}

footer {
  background: var(--green);
  color: var(--cream);
  padding: 25px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h2>Mack Magic Mobile Bar</h2>
  <p>Events and More</p>
</header>

<main>

  <h1>Special Occations</h1>

  <p>
    Whatever the occasion, let Mack Magic help
    make your event memorable.
  </p>

  <select id="occasion">
    <option value="">SELECT</option>
    <option value="face-painting/">Face Painting</option>
    <option value="bartending/">Bartending</option>
    <option value="mc-host-services/">MC & Host Services</option>
  </select>

</main>

<footer>
  Mack Magic Mobile Bar · Events and More
  <br>470-774-2370
</footer>

<script>
document.getElementById("occasion").addEventListener("change", function() {
  if (this.value) {
    window.location.href = this.value;
  }
});
</script>

</body>
</html>
